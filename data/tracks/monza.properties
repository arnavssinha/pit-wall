# Monza (Autodromo Nazionale Monza), Italy.
name=Monza
country=Italy
# Official circuit length in meters.
lapLengthMeters=5793
# APPROXIMATE, NOT FROM DATA YET: a typical green-flag race lap in recent seasons is about
# 1:24 to 1:26. To be replaced by the median of FastF1 green-flag race laps (tools/export_data.py).
medianRaceLapSeconds=85.0
# Balance choice (not from data): Monza is known for low tire wear, so it is below the neutral 1.0.
trackWearMultiplier=0.85
# Balance choice (not from data): Monza is one of the easiest tracks to pass on, 0 easy to 1 impossible.
overtakingDifficulty=0.15
# Pit lane (approximate, matched to the hand-built layout): entry 250 m before the line on the main
# straight, exit 250 m after it, on the right-hand side. The boxes are at the start/finish line.
pitEntryDistance=5543
pitExitDistance=250
pitSide=-1
# Balance choice (not from data): chance that an incident brings out the safety car in a race.
safetyCarProbability=0.3
# Balance choice (not from data): how changeable the weather is, 0 steady to 1 very changeable.
# It widens the error of the rain forecast.
weatherVolatility=0.3
# Balance/labeling choices from the project brief (Section 3.2).
difficultyLabel=Easy
description=Long straights, slipstream, heavy braking, low tire wear, lots of overtaking.
# Index into monza_centerline.csv where the start/finish line sits (printed by tools/HandBuiltTrackMaker.java).
startFinishIndex=365
dataSource=APPROXIMATE hand-built centerline and approximate target lap. Not FastF1 data yet.
